[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

airplay-ipc = { path = "crates/airplay-ipc" }

[patch.crates-io]
# Backport upstream B-slice prediction fix; see third_party/README.md.
openh264-sys2 = { path = "third_party/openh264-sys2" }

[profile.release]
lto = "thin"

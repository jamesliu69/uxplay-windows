[package]
name = "airplayd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AirPlay 2 receiver engine daemon (Rust rewrite of libuxplay)"

[[bin]]
name = "airplayd"
path = "src/main.rs"

[dependencies]
airplay-ipc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
shairplay = { version = "=0.10.0", features = ["video"] }
openh264 = "0.9"
minifb = "0.28"
cpal = "0.17"

[package]
name = "airplayd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AirPlay 2 receiver engine daemon (Rust rewrite of libuxplay)"

[[bin]]
name = "airplayd"
path = "src/main.rs"

[dependencies]
airplay-ipc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
shairplay = { path = "../../third_party/shairplay", features = ["video"] }
h264-reader = "0.9"
minifb = "0.28"
cpal = "0.17"

[dev-dependencies]
openh264 = "0.9"
bytemuck = "1"
yuv = { version = "0.8", default-features = false, features = ["avx", "sse"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi"] }
